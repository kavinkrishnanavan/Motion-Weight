[package]
name = "motionweight"
version = "0.2.0"
edition = "2021"
description = "MotionWeight video editor"

[[bin]]
name = "motionweight"
path = "src/main.rs"

[features]
# Scripted-input test harness; off by default so the shipped binary omits it.
harness = ["tiny-skia/png-format"]

[dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6"
softbuffer = { version = "0.4", default-features = false }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
ab_glyph = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
ureq = { version = "2", default-features = false, features = ["tls", "json", "gzip"] }
clipboard-win = "5"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1.31"
